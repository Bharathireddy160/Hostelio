<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Bookings - Hostelio Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    header {
      background: rgba(0,0,0,0.8);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }

    .nav-links a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #ffd700;
    }

    main {
      padding: 30px;
      background: rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      color: #ffd700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      color: black;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
    }

    th {
      background-color: #343a40;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    footer {
      text-align: center;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <img src="ic.png" alt="Logo" class="logo" />
    <div class="title">Hostelio Admin</div>
    <div class="nav-links">
      <a href="admin_dashboard.html">Dashboard</a>
      <a href="admin_upload_hostel.html">Add Hostel</a>
      <a href="index.html">Logout</a>
    </div>
  </header>

  <main>
    <h1>All Bookings</h1>
    <table id="bookingsTable">
      <thead>
        <tr>
          <th>Hostel</th>
          <th>Name</th>
          <th>Email</th>
          <th>Room Type</th>
          <th>Booking Date</th>
        </tr>
      </thead>
      <tbody>
        <!-- Booking rows will be inserted by JS -->
      </tbody>
    </table>
  </main>

  <!-- Firebase & Booking Loader -->
  <script type="module" src="viewBookings.js"></script>
  <footer>
    &copy; 2025 Hostelio. All rights reserved.
  </footer>
</body>

</html>
