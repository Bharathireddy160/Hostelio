<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 20px;
    }
    .profile-box {
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
    }
    .profile-box h2 {
      margin-bottom: 10px;
    }
    .profile-box p {
      margin: 6px 0;
      font-size: 16px;
    }
    .button {
      padding: 10px 18px;
      font-size: 16px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: 12px;
    }
    .button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>Hostelio - User Profile</header>

  <div class="container">
    <div class="profile-box">
      <h2>Welcome, UserName</h2>
      <p>Email: user@example.com</p>
      <p>Member since: July 2025</p>
      <a class="button" href="index.html">Log Out</a>
    </div>
  </div>
</body>
</html>
