<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Hostel - Hostelio Admin</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
 body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: rgba(0,0,0,0.8);
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #ffd700;
}

.nav-links a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}

.nav-links a:hover {
  color: #ffd700;
}

main {
  flex: 1;
  background: rgba(0,0,0,0.6);
  max-width: 600px;
  margin: 40px auto;
  padding: 30px;
  border-radius: 10px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, textarea {
  padding: 10px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  outline: none;
}

button {
  background-color: #28a745;
  color: white;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background-color: #218838;
}

footer {
  text-align: center;
  padding: 10px;
  background: rgba(0,0,0,0.8);
  font-size: 14px;
}

@media(max-width: 600px) {
  .title { font-size: 20px; }
}
</style>
</head>
<body>
<header>
  <div class="right-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="admin_dashboard.html">Dashboard</a>
    <a href="index.html">Logout</a>
  </div>
</header>
<main>
  <h1>Add New Hostel</h1>
  <form id="addHostelForm">
    <input type="text" id="hostelName" placeholder="Hostel Name" required>
    <input type="text" id="location" placeholder="Location" required>
    <textarea id="description" placeholder="Description" rows="4" required></textarea>
    <input type="number" id="rooms" placeholder="Available Rooms" min="1" required>
    <input type="number" id="price" placeholder="Price per month" min="1" required>
    <label style="font-weight:bold; font-size:16px;">Upload Hostel Images</label>
    <input type="file" id="hostelImages" multiple accept="image/*">
    <button type="submit">Add Hostel</button>
  </form>
</main>
<footer>
  &copy; 2025 Hostelio. All rights reserved.
</footer>

<!-- Script -->
<script type="module" src="js/uploadHostel.js"></script>
</body>
</html>
