<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Registered Users - Hostelio</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover; color: white;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 30px; background: rgba(0,0,0,0.8);
  }
  .title { font-size: 24px; font-weight: bold; color: #ffd700; }
  .nav-links a {
    color: white; text-decoration: none; margin-left: 20px; font-size: 16px;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: #ffd700; }
  main {
    flex: 1; background: rgba(0,0,0,0.7); padding: 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { margin-bottom: 20px; font-size: 36px; }
  table {
    width: 95%; max-width: 1000px; border-collapse: collapse; margin-top: 20px;
    background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
  }
  th, td {
    padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  th { background-color: rgba(0,0,0,0.5); color: #ffd700; }
  tr:hover { background-color: rgba(255,255,255,0.1); }
  .delete-btn {
    background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    transition: 0.3s;
  }
  .delete-btn:hover { background: #c82333; }
  .bookings-btn {
    background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    transition: 0.3s;
  }
  .bookings-btn:hover { background: #218838; }
</style>
</head>
<body>

<header>
  <div><img src="logo.png" alt="Hostelio Logo" style="height: 50px; width: auto;"></div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="admin_home.html">Home</a>
    <a href="add_hostels.html">Add Hostel</a>
    <a href="view_users.html">View Users</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </div>
</header>

<main>
  <h1>Registered Users</h1>
  <table id="usersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Location</th>
        <th>Registration Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Users will load dynamically here -->
    </tbody>
  </table>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_REAL_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const usersTable = document.querySelector("#usersTable tbody");

  async function loadUsers() {
    try {
      const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      usersTable.innerHTML = "";

      querySnapshot.forEach((docSnap) => {
        const user = docSnap.data();
        const date = user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleDateString() : "N/A";

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name || "N/A"}</td>
          <td>${user.email || "N/A"}</td>
          <td>${user.location || "Not Provided"}</td>
          <td>${date}</td>
          <td>
            <button class="bookings-btn" data-id="${docSnap.id}">View Bookings</button>
            <button class="delete-btn" data-id="${docSnap.id}">Delete</button>
          </td>
        `;
        usersTable.appendChild(row);
      });

      // Attach event listeners for delete buttons
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userId = btn.getAttribute("data-id");
          if (confirm("Are you sure you want to delete this user?")) {
            await deleteDoc(doc(db, "users", userId));
            alert("User deleted successfully!");
            loadUsers();
          }
        });
      });

      // Attach event listeners for bookings buttons
      document.querySelectorAll(".bookings-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const userId = btn.getAttribute("data-id");
          // Redirect to a bookings page passing userId
          window.location.href = `view_user_bookings.html?userId=${userId}`;
        });
      });

    } catch (err) {
      console.error("Error loading users:", err);
    }
  }

  loadUsers();

  function logout() {
    localStorage.removeItem('username');
  }
</script>

</body>
</html>
