<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking History - Hostelio</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(0,0,0,0.8);
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
  }
  .nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
  }
  .nav-links a:hover {
    color: #ffd700;
  }
  main {
    flex: 1;
    background: rgba(0,0,0,0.6);
    max-width: 800px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 10px;
  }
  h1 {
    text-align: center;
    color: #ffd700;
    margin-bottom: 20px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .history-card {
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 8px;
    font-size: 16px;
  }
  footer {
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,0.8);
  }

  .logo {
      width: 70px; height: 70px;
      border-radius: 50%; object-fit: cover;}

</style>
</head>
<body>
<header>

  <div class="left-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>

  <div class="title">Hostelio Admin</div>
  <div class="nav-links">
    <a href="admin_home.html">Dashboard</a>
    <a href="index.html">Logout</a>
  </div>
</header>
<main>
  <h1>Booking History</h1>
  <div class="history-list">
    <div class="history-card">
      <strong>User:</strong> Bharathi<br>
      <strong>Hostel:</strong> Sunrise Hostel, Mumbai<br>
      <strong>Check-in:</strong> 2025-07-21<br>
      <strong>Nights:</strong> 3
    </div>
    <div class="history-card">
      <strong>User:</strong> Anil<br>
      <strong>Hostel:</strong> Beachside Hostel, Goa<br>
      <strong>Check-in:</strong> 2025-08-01<br>
