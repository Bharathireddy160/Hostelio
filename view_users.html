<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Registered Users - Hostelio</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: url('images/bg.jpeg') no-repeat center center fixed;
    background-size: cover; color: white;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 30px; background: rgba(0,0,0,0.8);
  }
  .title { font-size: 24px; font-weight: bold; color: #ffd700; }
  .nav-links a {
    color: white; text-decoration: none; margin-left: 20px; font-size: 16px;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: #ffd700; }
  main {
    flex: 1; background: rgba(0,0,0,0.7); padding: 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { margin-bottom: 20px; font-size: 36px; }
  table {
    width: 95%; max-width: 1000px; border-collapse: collapse; margin-top: 20px;
    background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
  }
  th, td {
    padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  th { background-color: rgba(0,0,0,0.5); color: #ffd700; }
  tr:hover { background-color: rgba(255,255,255,0.1); }
  .delete-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }
  .delete-btn:hover {
    background: #c82333;
  }
</style>
</head>
<body>
<header>
  <div><img src="images/logo.png" alt="Hostelio Logo" style="height: 50px; width: auto;"></div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="admin_home.html">Home</a>
    <a href="add_hostels.html">Add Hostel</a>
    <a href="view_users.html">View Users</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </div>
</header>

<main>
  <h1>Registered Users</h1>
  <table id="usersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Location</th>
        <th>Registration Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Users will load dynamically here -->
    </tbody>
  </table>
</main>

<script type="module">
  // Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCLn45hIR-S75BEPypx1BFgOV8vA5MaqU0",
    authDomain: "hostelio-89130.firebaseapp.com",
    databaseURL: "https://hostelio-89130-default-rtdb.firebaseio.com",
    projectId: "hostelio-89130",
    storageBucket: "hostelio-89130.firebasestorage.app",
    messagingSenderId: "530522106867",
    appId: "1:530522106867:web:227d355ea3fcc63317c086",
    measurementId: "G-CYM1EHN5G5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);

  const usersTable = document.querySelector("#usersTable tbody");

  async function loadUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      usersTable.innerHTML = ""; // clear table

      querySnapshot.forEach((docSnap) => {
        const user = docSnap.data();
        let createdDate = "N/A";
        if (user.createdAt) {
          const seconds = user.createdAt.seconds || user.createdAt._seconds;
          createdDate = new Date(seconds * 1000).toLocaleDateString();
        }

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name || "N/A"}</td>
          <td>${user.email || "N/A"}</td>
          <td>${user.location || "Not Provided"}</td>
          <td>${createdDate}</td>
          <td><button class="delete-btn" data-id="${docSnap.id}">Delete</button></td>
        `;
        usersTable.appendChild(row);
      });

      // Attach delete button listeners dynamically
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userId = btn.getAttribute("data-id");
          if (confirm("Are you sure you want to delete this user?")) {
            try {
              await deleteDoc(doc(db, "users", userId));
              alert("User deleted successfully!");
              loadUsers(); // refresh table
            } catch (err) {
              console.error("Error deleting user:", err);
              alert("Failed to delete user.");
            }
          }
        });
      });
    } catch (err) {
      console.error("Error loading users:", err);
      alert("Failed to load users.");
    }
  }

  function logout() {
    localStorage.removeItem("username");
  }

  // Load users on page load
  loadUsers();
</script>
</body>
</html>
