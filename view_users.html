<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Registered Users - Hostelio</title>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover; color: white;
      display: flex; flex-direction: column; min-height: 100vh;
    }

    .button {
      width: 220px;
      padding: 14px 20px;
      font-size: 17px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 30px; background: rgba(0,0,0,0.8);
    }
    .title { font-size: 24px; font-weight: bold; color: #ffd700; }
    .nav-links a {
      color: white; text-decoration: none; margin-left: 20px; font-size: 16px;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: #ffd700; }
    main {
      flex: 1; background: rgba(0,0,0,0.7); padding: 40px;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { margin-bottom: 20px; font-size: 36px; }
    table {
      width: 95%; max-width: 1000px; border-collapse: collapse; margin-top: 20px;
      background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
    }
    th, td {
      padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    th {
      background-color: rgba(0,0,0,0.5); color: #ffd700;
    }
    tr:hover { background-color: rgba(255,255,255,0.1); }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .delete-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
<header>
 <div><img src="logo.png" alt="Hostelio Logo" style="height: 50px; width: auto;"></div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="admin_home.html">Home</a>
    <a href="add_hostels.html">Add Hostel</a>
    <a href="view_users.html">View Users</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </div>
</header>

<main>
  <h1>Registered Users</h1>
  <table id="usersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Location</th>
        <th>Registration Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Users will load dynamically here -->
    </tbody>
  </table>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const usersTable = document.querySelector("#usersTable tbody");

  async function loadUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      usersTable.innerHTML = ""; // clear table before loading
      querySnapshot.forEach((docSnap) => {
        const user = docSnap.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name || "N/A"}</td>
          <td>${user.email || "N/A"}</td>
          <td>${user.location || "Not Provided"}</td>
          <td>${user.createdAt || "N/A"}</td>
          <td><button class="delete-btn" data-id="${docSnap.id}">Delete</button></td>
        `;
        usersTable.appendChild(row);
      });

      // Attach event listeners for delete buttons
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userId = btn.getAttribute("data-id");
          if (confirm("Are you sure you want to delete this user?")) {
            try {
              await deleteDoc(doc(db, "users", userId));
              alert("User deleted successfully!");
              loadUsers(); // refresh table
            } catch (err) {
              console.error("Error deleting user:", err);
              alert("Failed to delete user.");
            }
          }
        });
      });

    } catch (error) {
      console.error("Error loading users:", error);
    }
  }

  loadUsers();

  function logout() {
    localStorage.removeItem('username');
  }
</script>
</body>
</html>
