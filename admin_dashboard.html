<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - Hostelio</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(0,0,0,0.8);
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
  }
  .nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
    font-size: 16px;
  }
  .nav-links a:hover {
    color: #ffd700;
  }
  main {
    flex: 1;
    background: rgba(0,0,0,0.6);
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  h1 {
    color: #ffd700;
    margin-bottom: 30px;
  }
  .button {
    display: inline-block;
    margin: 15px;
    padding: 14px 25px;
    font-size: 18px;
    color: white;
    background-color: #28a745;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    transition: background-color 0.3s;
  }
  .button:hover {
    background-color: #218838;
  }
  footer {
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,0.8);
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <div class="title">Hostelio Admin</div>
  <div class="nav-links">
    <a href="index.html">Logout</a>
  </div>
</header>
<main>
  <h1>Welcome to the Admin Dashboard</h1>
  <a href="add_hostel.html" class="button">Add Hostel</a>
  <a href="view_history.html" class="button">View Booking History</a>
</main>
<footer>
  &copy; 2025 Hostelio. All rights reserved.
</footer>
</body>
</html>
