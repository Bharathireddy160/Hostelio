<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 30px; background: rgba(0,0,0,0.8);
    }
    .title { font-size: 24px; font-weight: bold; color: #ffd700; }
    .nav-links a {
      color: white; text-decoration: none; margin-left: 20px;
    }
    .nav-links a:hover { color: #ffd700; }
    main {
      flex: 1; background: rgba(0,0,0,0.6); margin: 40px auto;
      max-width: 800px; padding: 30px; border-radius: 10px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
      color: #ffd700;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .button {
      background-color: #28a745;
      color: white;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #218838;
    }
    
    .logo {
      width: 70px; height: 70px;
      border-radius: 50%; object-fit: cover;
    }
    

  </style>
</head>
<body>

<header>

   <div class="left-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>

  <div class="title">Hostelio - Admin</div>
  <div class="nav-links">
    <a href="index.html">Logout</a>
  </div>
</header>

<main>
  <h1>Admin Dashboard</h1>
  <div class="button-row">
    <a class="button" href="view_users.html">View Registered Users</a>
    <a class="button" href="view_bookings.html">View Bookings</a>
    <a class="button" href="add_hostel.html">Add Hostel</a>
    <a class="button" href="admin_history.html">Booking History</a>
  </div>
</main>

<footer style="text-align:center; padding:10px; background: rgba(0,0,0,0.8);">
  &copy; 2025 Hostelio. All rights reserved.
</footer>

</body>
</html>
