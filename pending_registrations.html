<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pending Registrations - Hostelio Admin</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:url('images/bg.jpeg') no-repeat center center fixed; background-size:cover; }
    header { background:rgba(51,51,51,0.8); color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
    .title { font-size:24px; font-weight:bold; color:#ffd700; }
    main { max-width:900px; margin:30px auto; background:#333; padding:20px; border-radius:10px; color:white; }
    table { width:100%; border-collapse:collapse; background:white; color:black; border-radius:8px; overflow:hidden; }
    th, td { border:1px solid #ccc; padding:10px; text-align:left; }
    th { background:#ffd700; color:white; }
    tr:nth-child(even) { background:#f9f9f9; }
    button { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; }
    .accept { background:#28a745; color:white; } .accept:hover{background:#218838;}
    .reject { background:#dc3545; color:white; } .reject:hover{background:#c82333;}
  </style>
</head>
<body>
  <header>
    <img src="images/ic.png" alt="Logo" style="width:60px;height:60px;border-radius:50%;object-fit:cover;">
    <div class="title">Hostelio Admin</div>
    <a href="admin_dashboard.html" style="color:white;">Dashboard</a>
  </header>

  <main>
    <h1>Pending Registrations</h1>
    <table id="registrationTable">
      <tr>
        <th>Name</th><th>Email</th><th>Hostel</th><th>Room Type</th><th>Action</th>
      </tr>
    </table>
  
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLn45hIR-S75BEPypx1BFgOV8vA5MaqU0",
      authDomain: "hostelio-89130.firebaseapp.com",
      projectId: "hostelio-89130",
      storageBucket: "hostelio-89130.appspot.com",
      messagingSenderId: "530522106867",
      appId: "1:530522106867:web:227d355ea3fcc63317c086"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function getHostelName(hostelId) {
      if (!hostelId) return "N/A";
      try {
        const docSnap = await getDoc(doc(db, "hostels", hostelId));
        return docSnap.exists() ? docSnap.data().name : "Unknown Hostel";
      } catch {
        return "Unknown Hostel";
      }
    }

    async function loadRegistrations() {
      const table = document.getElementById('registrationTable');
      const snapshot = await getDocs(collection(db, "pendingRegistrations"));
      for (const docSnap of snapshot.docs) {
        const data = docSnap.data();
        const hostelName = await getHostelName(data.hostelId);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${data.name}</td>
          <td>${data.email}</td>
          <td>${hostelName}</td>
          <td>${data.roomType}</td>
          <td>
            <button class="accept">Accept</button>
            <button class="reject">Reject</button>
          </td>`;
        table.appendChild(row);

        row.querySelector('.accept').addEventListener('click', async () => {
          await addDoc(collection(db, "bookings"), data);
          await deleteDoc(doc(db, "pendingRegistrations", docSnap.id));
          alert("✅ Accepted & moved to bookings.");
          row.remove();
        });

        row.querySelector('.reject').addEventListener('click', async () => {
          await deleteDoc(doc(db, "pendingRegistrations", docSnap.id));
          alert("❌ Registration rejected.");
          row.remove();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', loadRegistrations);
  </script>
  <td>
  <a href="hostel_details.html?id=${data.hostelId}" target="_blank" style="color:#007bff; text-decoration:none;">
    HOSTEL DETAILS
  </a>
</td>
<footer>
  &copy; 2025 Hostelio. All rights reserved.
</footer>
</body>
</html>
