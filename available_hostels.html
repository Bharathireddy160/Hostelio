<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Hostels - Hostelio</title>
  <style>
    body { margin:0; font-family: Arial,sans-serif; background:url('bg.jpeg') no-repeat center/cover fixed; color:white; }
    header, footer { background:rgba(0,0,0,0.8); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
    .logo { width:60px; height:60px; border-radius:50%; }
    .title { font-size:24px; font-weight:bold; color:#ffd700; }
    .nav-links a { color:white; margin-left:20px; text-decoration:none; }
    .nav-links a:hover { color:#ffd700; }
    main { padding:30px; background:rgba(0,0,0,0.6); min-height:80vh; }
    h1 { text-align:center; color:#ffd700; margin-bottom:20px; }
    .hostel-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
    .hostel-card { background:rgba(0,0,0,0.75); padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.5); }
    .hostel-card h3 { margin:0; color:#ffd700; }
    button { margin-top:10px; padding:8px 15px; background:#ffd700; color:black; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:orange; }
  </style>
</head>
<body>
  <header>
    <img src="ic.png" alt="Logo" class="logo">
    <div class="title">Hostelio</div>
    <div class="nav-links">
      <a href="user_dashboard.html">Home</a>
      <a href="index.html">Logout</a>
    </div>
  </header>

  <main>
    <h1>Available Hostels</h1>
    <div class="hostel-list" id="hostelList">
      <p>Loading hostels...</p>
    </div>
  </main>

  <footer>&copy; 2025 Hostelio. All rights reserved.</footer>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const userEmail = localStorage.getItem("userEmail");
    const hostelList = document.getElementById("hostelList");

    async function loadHostels() {
      const snap = await getDocs(collection(db, "hostels"));
      hostelList.innerHTML = "";
      snap.forEach((doc) => {
        const h = doc.data();
        hostelList.innerHTML += `
          <div class="hostel-card">
            <h3>${h.name}</h3>
            <p><strong>Location:</strong> ${h.location}</p>
            <p><strong>Price:</strong> ₹${h.price}</p>
            <button onclick="bookHostel('${doc.id}','${h.name}','${h.price}')">Book Now</button>
          </div>
        `;
      });
    }

    window.bookHostel = async (id,name,price) => {
      if(!userEmail){ alert("Login required!"); return; }
      await addDoc(collection(db,"bookings"), {
        email:userEmail, hostelId:id, hostelName:name, roomType:"Standard", date:new Date().toISOString().split("T")[0]
      });
      alert("Booking confirmed for "+name);
    };

    loadHostels();
  </script>
</body>
</html>
