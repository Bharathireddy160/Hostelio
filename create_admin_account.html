<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin Account - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 20px;
    }
    .form-box {
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    .form-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    .button {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }
    .button:hover {
      background-color: #218838;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>Hostelio - Create Admin Account</header>

  <div class="container">
    <div class="form-box">
      <h2>Create Admin Account</h2>
      <form onsubmit="return validateForm()">
        <input type="text" id="adminUsername" placeholder="Admin Username" required>
        <input type="email" id="adminEmail" placeholder="Email" required>
        <input type="password" id="adminPassword" placeholder="Password" required>
        <input type="password" id="adminConfirmPassword" placeholder="Confirm Password" required>
        <button type="submit" class="button">Create Account</button>
      </form>
      <a class="back-link" href="index.html">Back to Home</a>
    </div>
  </div>

  
  <script>
document.getElementById('adminRegisterForm').addEventListener('submit', function(e) {
  e.preventDefault();
  window.location.href = 'admin_success.html';
});
</script>
</body>
</html>
