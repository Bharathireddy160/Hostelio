<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('images/bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
    }
    .left-section {
      display: flex;
      align-items: center;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      margin-left: 10px;
      color: #ffd700;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #ffd700;
    }
    .logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 20px;
    }
    .form-box {
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    .form-box h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #ffd700;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    .button {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }
    .button:hover {
      background-color: #218838;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: white;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="left-section">
      <img src="images/ic.png" alt="Logo" class="logo">
      <div class="title">Hostelio</div>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </header>
  <div class="container">
    <div class="form-box">
      <h2>Reset Your Password</h2>
      <form onsubmit="return resetPassword()">
        <input type="email" id="resetEmail" placeholder="Enter your email" required>
        <button type="submit" class="button">Send Reset Link</button>
      </form>
      <a class="back-link" href="index.html">Back to Home</a>
    </div>
  </div>
  <script>
    function resetPassword() {
      var email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        alert('Please enter your email.');
        return false;
      }
      alert('Password reset link sent to ' + email);
      return false; // prevent form from submitting (since this is front-end only)
    }
  </script>
</body>
</html>
