<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending Registrations - Hostelio Admin</title>
<style>
  
   body {
    margin: 0; font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover; color: #333;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    background: rgba(51, 51, 51, 0.8); color:#333;
    padding: 15px 30px; display: flex; justify-content: space-between;
  }
  .title { font-size: 24px; font-weight: bold; color: #ffd700; }
  main {
    flex: 1; max-width: 800px; margin: 30px auto; background: #333;
    padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 20px; }
  table {
    width: 100%; border-collapse: collapse;
  }
  th, td {
    border: 1px solid #ccc; padding: 10px; text-align: left;
  }
  th { background: #ffd700; color: white; }
  button {
    margin-right: 5px; padding: 6px 10px; border: none; border-radius: 4px;
    cursor: pointer;
  }
  .accept { background: #28a745; color: white; }
  .reject { background: #dc3545; color: white; }
   .logo {
      width: 70px; height: 70px;
      border-radius: 50%; object-fit: cover;
    }
</style>
</head>
<body>
<header>
  <div class="left-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>
  <div class="title">Hostelio Admin</div>
  <div>
    <a href="admin_dashboard.html" style="color:white;text-decoration:none;">Dashboard</a>
  </div>
</header>
<main>
  <h1>Pending Registrations</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Hostel</th>
      <th>Room Type</th>
      <th>Action</th>
    </tr>
    <tr>
      <td>Rahul Sharma</td>
      <td>rahul@example.com</td>
      <td>Sunrise Hostel</td>
      <td>Single</td>
      <td>
        <button class="accept">Accept</button>
        <button class="reject">Reject</button>
      </td>
    </tr>
    <tr>
      <td>Priya Patel</td>
      <td>priya@example.com</td>
      <td>Blue Sky Hostel</td>
      <td>Double Sharing</td>
      <td>
        <button class="accept">Accept</button>
        <button class="reject">Reject</button>
      </td>
    </tr>
  </table>
</main>
</body>
</html>
