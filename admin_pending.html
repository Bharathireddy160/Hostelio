<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending Registrations - Hostelio Admin</title>

<!-- CSS Styles -->
<style>
  body {
    margin: 0; 
    font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover; 
    color: #333;
    display: flex; 
    flex-direction: column; 
    min-height: 100vh;
  }
  header {
    background: rgba(51, 51, 51, 0.8); 
    color: white;
    padding: 15px 30px; 
    display: flex; 
    justify-content: space-between;
    align-items: center;
  }
  .title { 
    font-size: 24px; 
    font-weight: bold; 
    color: #ffd700; 
  }
  main {
    flex: 1; 
    max-width: 800px; 
    margin: 30px auto; 
    background: #333;
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
  }
  h1 { 
    text-align: center; 
    margin-bottom: 20px; 
  }
  table {
    width: 100%; 
    border-collapse: collapse;
    background: white; /* always keep table background white */
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid #ccc; 
    padding: 10px; 
    text-align: left;
  }
  th { 
    background: #ffd700; 
    color: white; 
  }
  tr:nth-child(even) {
    background-color: #f9f9f9;
  }
  button {
    margin-right: 5px; 
    padding: 6px 12px; 
    border: none; 
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  }
  .accept { 
    background: #28a745; 
    color: white; 
  }
  .accept:hover {
    background: #218838; 
    transform: scale(1.05);
  }
  .reject { 
    background: #dc3545; 
    color: white; 
  }
  .reject:hover {
    background: #c82333; 
    transform: scale(1.05);
  }
  .logo {
    width: 70px; 
    height: 70px;
    border-radius: 50%; 
    object-fit: cover;
  }
  a {
    color: white;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <div class="left-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>
  <div class="title">Hostelio Admin</div>
  <div>
    <a href="admin_dashboard.html">Dashboard</a>
  </div>
</header>

<main>
  <h1>Pending Registrations</h1>
  <table id="registrationTable">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Hostel</th>
      <th>Room Type</th>
      <th>Action</th>
    </tr>
    <!-- Data rows will be dynamically inserted here -->
  </table>
</main>

<!-- Firebase SDKs -->
<script type="module">
  // Import Firebase modules from CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCLn45hIR-S75BEPypx1BFgOV8vA5MaqU0",
    authDomain: "hostelio-89130.firebaseapp.com",
    databaseURL: "https://hostelio-89130-default-rtdb.firebaseio.com",
    projectId: "hostelio-89130",
    storageBucket: "hostelio-89130.firebasestorage.app",
    messagingSenderId: "530522106867",
    appId: "1:530522106867:web:227d355ea3fcc63317c086",
    measurementId: "G-CYM1EHN5G5"
  };

  // Initialize Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Load pending registrations
  async function loadRegistrations() {
    const table = document.getElementById('registrationTable');
    try {
      const querySnapshot = await getDocs(collection(db, "pendingRegistrations"));
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${data.name}</td>
          <td>${data.email}</td>
          <td>${data.hostel}</td>
          <td>${data.roomType}</td>
          <td>
            <button class="accept">Accept</button>
            <button class="reject">Reject</button>
          </td>`;
        table.appendChild(row);
      });
      attachButtonListeners();
    } catch (error) {
      console.error("Error loading registrations:", error);
    }
  }

  // Add Accept/Reject interactivity
  function attachButtonListeners() {
    document.querySelectorAll('.accept').forEach(btn => {
      btn.addEventListener('click', () => {
        alert('Registration accepted!');
        btn.closest('tr').remove();
      });
    });
    document.querySelectorAll('.reject').forEach(btn => {
      btn.addEventListener('click', () => {
        alert('Registration rejected!');
        btn.closest('tr').remove();
      });
    });
  }

  // Load data when page loads
  document.addEventListener('DOMContentLoaded', loadRegistrations);
</script>
</body>
</html>
