<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Hostelio</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: url('bg.jpeg') no-repeat center center fixed;
    background-size: cover; color: white;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 30px; background: rgba(0,0,0,0.8);
  }
  .title { font-size: 24px; font-weight: bold; color: #ffd700; }
  .nav-links a {
    color: white; text-decoration: none; margin-left: 20px;
  }
  .nav-links a:hover { color: #ffd700; }
  main {
    flex: 1; max-width: 400px; margin: 40px auto;
    background: rgba(0,0,0,0.6); padding: 20px;
    border-radius: 10px;
  }
  h1 { text-align: center; color: #ffd700; margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px; margin-bottom: 15px;
    border: none; border-radius: 6px; font-size: 16px;
  }
  button {
    width: 100%; background-color: #28a745; color: white;
    padding: 12px; border: none; border-radius: 8px;
    font-size: 17px; cursor: pointer;
  }
  button:hover { background-color: #218838; }
  .create-account {
    text-align: center; margin-top: 10px;
  }
  .create-account a {
    color: #ffd700; text-decoration: none;
  }
  .create-account a:hover { text-decoration: underline; }
  .logo { height: 100px; margin-right: 10px; }
</style>
</head>
<body>
<header>
  <div class="left-section">
    <img src="ic.png" alt="Hostelio Logo" class="logo">
  </div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
  </div>
</header>
<main>
  <h1>Admin Login</h1>
  <form>
    <label for="username">Username</label>
    <input type="text" id="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Login</button>
  </form>
  <div class="create-account">
    <p>Don't have an account? <a href="create_admin_account.html">Create Admin Account</a></p>
  </div>
</main>
</body>
</html>
