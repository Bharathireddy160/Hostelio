<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Hostels | Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: rgba(44, 62, 80, 0.8);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }
    nav a:hover {
      color: #ffd700;
    }

    .search-bar {
      padding: 20px;
      text-align: center;
      background-color: #ecf0f1;
    }
    .search-bar input {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .hostel-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 30px;
      justify-content: center;
    }
    .hostel-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      transition: transform 0.3s;
      color: black;
    }
    .hostel-card:hover {
      transform: scale(1.02);
    }
    .hostel-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .hostel-info {
      padding: 15px;
    }
    .hostel-info h3 {
      margin: 0 0 8px;
    }
    .hostel-info p {
      margin: 5px 0;
      color: #555;
    }
    .hostel-info .price {
      font-weight: bold;
      color: #28a745;
    }
    .explore-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
    }
    .explore-btn:hover {
      background-color: #0056b3;
    }

    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .search-bar input {
        width: 95%;
      }
      .hostel-grid {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Hostelio</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="user_dashboard.html">Dashboard</a>
    </nav>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by location or name..." />
  </div>

  <div class="hostel-grid" id="hostelGrid">
    <!-- Hostel cards will be loaded here -->
  </div>

  <footer>
    &copy; 2025 Hostelio. All rights reserved.
  </footer>

  <!-- Firebase SDKs -->
  <script type="module">
    import { db } from './firebase.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const hostelGrid = document.getElementById("hostelGrid");
    const searchInput = document.getElementById("searchInput");

    async function loadHostels() {
      const querySnapshot = await getDocs(collection(db, "hostels"));
      const hostels = [];

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        hostels.push({ id: doc.id, ...data });
      });

      displayHostels(hostels);

      // 🔍 Search functionality
      searchInput.addEventListener("input", () => {
        const value = searchInput.value.toLowerCase();
        const filtered = hostels.filter(h =>
          h.name.toLowerCase().includes(value) ||
          h.location.toLowerCase().includes(value)
        );
        displayHostels(filtered);
      });
    }

    function displayHostels(hostels) {
      hostelGrid.innerHTML = ""; // clear previous
      if (hostels.length === 0) {
        hostelGrid.innerHTML = "<p>No hostels found.</p>";
        return;
      }
      hostels.forEach(h => {
        const img = h.imageUrls?.[0] || 'images/default.jpg';
        hostelGrid.innerHTML += `
          <div class="hostel-card">
            <img src="${img}" alt="${h.name}">
            <div class="hostel-info">
              <h3>${h.name}</h3>
              <p>${h.location}</p>
              <p class="price">₹${h.price}/month</p>
              <a class="explore-btn" href="hostel_details.html?id=${h.id}">View Details</a>
            </div>
          </div>
        `;
      });
    }

    loadHostels();
  </script>
</body>
</html>
