<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostelio - Explore Hostels</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    #map { height: 80vh; width: 100%; }
    .search-box {
      background: #fff;
      padding: 10px;
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .search-box input, .search-box button {
      padding: 8px;
      margin: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .search-box button {
      background: #ffd700;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .search-box button:hover { background: #e6c200; }
  </style>
</head>
<body>
  <div class="search-box">
    <input type="text" id="searchLocation" placeholder="Enter city">
    <button onclick="searchCity()">Search</button>
  </div>
  <div id="map"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔥 Firebase Config (replace with yours)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let map, geocoder;

    // 🗺️ Initialize Google Map
    window.initMap = async function() {
      geocoder = new google.maps.Geocoder();
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 17.385044, lng: 78.486671 }, // Default Hyderabad
        zoom: 6
      });

      // Fetch hostels from Firestore
      const querySnapshot = await getDocs(collection(db, "hostels"));
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.lat && data.lng) {
          new google.maps.Marker({
            position: { lat: data.lat, lng: data.lng },
            map,
            title: data.name || "Hostel"
          });
        }
      });
    };

    // 🔍 Search city and move map
    window.searchCity = function() {
      const city = document.getElementById("searchLocation").value;
      if (!city) return;
      geocoder.geocode({ address: city }, (results, status) => {
        if (status === "OK") {
          map.setCenter(results[0].geometry.location);
          map.setZoom(12);
        } else {
          alert("City not found: " + status);
        }
      });
    };
  </script>

  <!-- Google Maps API -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
  </script>
</body>
</html>
