<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostels - Hostelio</title>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover; color: white;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      background: rgba(0,0,0,0.8); padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .title { font-size: 24px; font-weight: bold; color: #ffd700; }
    .nav-links a {
      color: white; text-decoration: none; margin-left: 20px;
    }
    .nav-links a:hover { color: #ffd700; }
    .logo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; }
    main {
      flex: 1; background: rgba(0,0,0,0.6);
      max-width: 1000px; margin: 30px auto; padding: 20px; border-radius: 10px;
    }
    h1 { text-align: center; color: #ffd700; margin-bottom: 20px; }
    .hostel-list {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .hostel-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid #444; border-radius: 10px;
      overflow: hidden; text-align: center; padding: 10px;
    }
    .hostel-card img {
      width: 100%; height: 150px; object-fit: cover; border-radius: 8px;
    }
    .hostel-card h3 { margin: 10px 0 5px; color: #ffd700; }
    .hostel-card p { margin: 5px 0; }
    @media (max-width: 600px) {
      main { padding: 15px; }
      .hostel-card img { height: 120px; }
    }
  </style>
</head>
<body>
<header>
  <div class="left-section">
    <img src="ic.png" alt="Logo" class="logo">
  </div>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="user_dashboard.html">Dashboard</a>
  </div>
</header>

<main>
  <h1>Available Hostels</h1>
  <div id="hostel-list" class="hostel-list">Loading...</div>
</main>

<script type="module" src="hostel-list.js"></script>
</body>
</html>
