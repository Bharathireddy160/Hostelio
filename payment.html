<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostelio - Payment</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: url('images/bg.jpeg') no-repeat center center fixed;
    background-size: cover; color: white; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 30px; background: rgba(0,0,0,0.8);
  }
  .title { font-size: 24px; font-weight: bold; color: #ffd700; }
  .nav-links a {
    color: white; text-decoration: none; margin-left: 20px; font-size: 16px;
  }
  .nav-links a:hover { color: #ffd700; }
  main {
    flex: 1; padding: 30px; max-width: 700px; margin: 40px auto;
    background: rgba(0,0,0,0.6); border-radius: 12px;
  }
  h1 { text-align: center; color: #ffd700; }
  .payment-method {
    margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.1);
    border-radius: 8px;
  }
  label { display: block; margin-top: 10px; }
  input, select {
    width: 100%; padding: 10px; border-radius: 6px; border: none; margin-top: 5px;
  }
  button {
    background: #ffd700; color: black; border: none;
    padding: 12px 20px; margin-top: 20px; border-radius: 8px;
    cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;
  }
  button:hover { background: #e6c200; }
</style>
</head>
<body>
<header>
  <div class="title">Hostelio</div>
  <div class="nav-links">
    <a href="user_home.html">Home</a>
    <a href="explore_hostels.html">Explore</a>
    <a href="user_booking_history.html">My Bookings</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </div>
</header>

<main>
  <h1>Complete Your Payment</h1>

  <!-- UPI Payment -->
  <div class="payment-method">
    <h2>Pay via UPI</h2>
    <label>Enter UPI ID:</label>
    <input type="text" id="upiId" placeholder="example@upi">
  </div>

  <!-- Card Payment -->
  <div class="payment-method">
    <h2>Pay via Card</h2>
    <label>Card Number:</label>
    <input type="text" id="cardNumber" maxlength="16" placeholder="1234 5678 9012 3456">
    <label>Expiry Date:</label>
    <input type="month" id="expiry">
    <label>CVV:</label>
    <input type="password" id="cvv" maxlength="3" placeholder="123">
  </div>

  <!-- Netbanking -->
  <div class="payment-method">
    <h2>Pay via Netbanking</h2>
    <label>Select Bank:</label>
    <select id="bank">
      <option value="">-- Select Bank --</option>
      <option value="SBI">State Bank of India</option>
      <option value="HDFC">HDFC Bank</option>
      <option value="ICICI">ICICI Bank</option>
      <option value="AXIS">Axis Bank</option>
    </select>
  </div>

  <button onclick="makePayment()">Confirm & Pay</button>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCLn45hIR-S75BEPypx1BFgOV8vA5MaqU0",
    authDomain: "hostelio-89130.firebaseapp.com",
    databaseURL: "https://hostelio-89130-default-rtdb.firebaseio.com",
    projectId: "hostelio-89130",
    storageBucket: "hostelio-89130.firebasestorage.app",
    messagingSenderId: "530522106867",
    appId: "1:530522106867:web:227d355ea3fcc63317c086",
    measurementId: "G-CYM1EHN5G5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function makePayment() {
    const upiId = document.getElementById("upiId").value.trim();
    const cardNumber = document.getElementById("cardNumber").value.trim();
    const expiry = document.getElementById("expiry").value;
    const cvv = document.getElementById("cvv").value.trim();
    const bank = document.getElementById("bank").value;

    if (!upiId && (!cardNumber || !expiry || !cvv) && !bank) {
      alert("Please enter at least one payment method!");
      return;
    }

    try {
      await addDoc(collection(db, "payments"), {
        upiId: upiId || null,
        cardNumber: cardNumber ? "XXXX-XXXX-XXXX-" + cardNumber.slice(-4) : null,
        bank: bank || null,
        status: "Success",
        createdAt: serverTimestamp()
      });

      alert("✅ Payment Successful! Your booking is confirmed.");
      window.location.href = "user_booking_history.html";
    } catch (error) {
      console.error("Payment failed: ", error);
      alert("❌ Payment failed, try again.");
    }
  }

  function logout() {
    localStorage.removeItem("username");
  }
</script>
</body>
</html>
