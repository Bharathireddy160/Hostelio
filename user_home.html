<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Home - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
    }
    .title {
      font-size: 24px;
      font-weight: bold;
       color: #ffd700;
    }
    
    .nav-links a:hover {
      color: #ffd700;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px 20px;
    }
    .welcome {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .button-row {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .button {
      width: 200px;
      padding: 14px 20px;
      font-size: 17px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #218838;
    }
    footer {
      text-align: center;
      padding: 10px 0;
      background: rgba(0, 0, 0, 0.8);
      font-size: 14px;}

     .logo {
      width: 70px; height: 70px;
      border-radius: 50%; object-fit: cover;}



  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Hostelio Logo" class="logo">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="user_history.html">Booking History</a>
    </div>
  </header>

  <div class="container">
    <p class="welcome">Welcome, User!</p>
    <p class="subtitle">What would you like to do next?</p>
    <div class="button-row">
      <a class="button" href="explore_hostels.html">Explore Hostels</a>
      <a class="button" href="user_registration.html">Registration</a>
    </div>
  </div>
  <script type="module" src="home.js"></script>

  <footer>
    &copy; 2025 Hostelio. All rights reserved.
  </footer>
</body>
</html>
