<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Hostels - Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #ffd700;
    }
    main {
      flex: 1;
      background: rgba(0, 0, 0, 0.7);
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
      text-align: center;
      color: #ffd700;
    }
    ul.hostel-list {
      list-style-type: none;
      padding: 0;
      width: 100%;
    }
    ul.hostel-list li {
      margin-bottom: 15px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 8px;
    }
    ul.hostel-list li a {
      color: #28a745;
      text-decoration: underline;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
    }
    ul.hostel-list li a:hover {
      color: #1e7e34;
    }
    .back-button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .back-button:hover {
      background-color: #218838;
    }
    footer {
      text-align: center;
      padding: 10px 0;
      background: rgba(0, 0, 0, 0.8);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Hostelio</div>
    <div class="nav-links">
      <a href="index.html">Main Home</a>
      <a href="user_home.html">User Home</a>
      <a href="user_profile.html">Profile</a>
      <a href="index.html">Logout</a>
    </div>
  </header>

  <main>
    <h1>Explore Hostels</h1>
    <ul class="hostel-list">
      <li>
        <span>Sunrise Hostel - Mumbai</span>
        <a href="hostel_details.html">View Details</a>
      </li>
      <li>
        <span>Green Leaf Hostel - Bangalore</span>
        <a href="#">View Details</a>
      </li>
      <li>
        <span>Ocean View Hostel - Goa</span>
        <a href="#">View Details</a>
      </li>
    </ul>

    <a href="user_home.html" class="back-button">Back to Home</a>
  </main>

  <footer>
    &copy; 2025 Hostelio. All rights reserved.
  </footer>
</body>
</html>
