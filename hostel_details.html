<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hostel Details | Hostelio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }
    main {
      flex: 1;
      background: rgba(0, 0, 0, 0.7);
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    h1 {
      text-align: center;
      color: #ffd700;
    }
    .details img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .details p {
      font-size: 18px;
      margin-bottom: 10px;
    }
    form {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input, select {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    #successMessage {
      color: lightgreen;
      font-weight: bold;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 10px;
      background: rgba(0, 0, 0, 0.8);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Hostelio</div>
    <div class="nav-links">
      <a href="explore_hostels.html">Back to Explore</a>
      <a href="index.html">Logout</a>
    </div>
  </header>

  <main>
    <h1>Hostel Details</h1>
    <div class="details" id="hostelDetails">
      <!-- Hostel info will load here -->
    </div>

    <form id="bookingForm">
      <h2>Book Now</h2>
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="date" id="bookingDate" required />
      <select id="roomType" required>
        <option value="">Select Room Type</option>
        <option value="Single">Single</option>
        <option value="Double">Double</option>
        <option value="Dormitory">Dormitory</option>
      </select>
      <button type="submit">Confirm Booking</button>
      <div id="successMessage"></div>
    </form>
  </main>

  <footer>
    &copy; 2025 Hostelio. All rights reserved.
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { db } from 'firebase.js';
    import {
      doc, getDoc, collection, addDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // Get hostel ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const hostelId = urlParams.get('id');

    const hostelDetails = document.getElementById('hostelDetails');
    const successMessage = document.getElementById('successMessage');

    async function loadHostel() {
      if (!hostelId) {
        hostelDetails.innerHTML = "<p>No hostel selected.</p>";
        return;
      }

      const docRef = doc(db, "hostels", hostelId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const h = docSnap.data();
        const img = h.imageUrls?.[0] || 'images/default.jpg';
        hostelDetails.innerHTML = `
          <img src="${img}" alt="${h.name}">
          <p><strong>Name:</strong> ${h.name}</p>
          <p><strong>Location:</strong> ${h.location}</p>
          <p><strong>Price per Month:</strong> ₹${h.price}</p>
          <p><strong>Description:</strong> ${h.description}</p>
        `;
      } else {
        hostelDetails.innerHTML = "<p>Hostel not found.</p>";
      }
    }

    loadHostel();

    // Handle Booking
    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const bookingDate = document.getElementById("bookingDate").value;
      const roomType = document.getElementById("roomType").value;

      if (!name || !email || !bookingDate || !roomType) return;

      try {
        await addDoc(collection(db, "bookings"), {
          hostelId,
          name,
          email,
          bookingDate,
          roomType,
          createdAt: serverTimestamp()
        });

        successMessage.textContent = "✅ Booking successful!";
        document.getElementById("bookingForm").reset();
      } catch (err) {
        successMessage.textContent = "❌ Error booking hostel.";
        console.error("Booking error:", err);
      }
    });
  </script>
</body>
</html>
