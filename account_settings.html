<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - Hostelio</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:url('bg.jpeg') no-repeat center/cover fixed; color:white; }
    header, footer { background:rgba(0,0,0,0.8); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
    .logo { width:60px; height:60px; border-radius:50%; }
    .title { font-size:24px; font-weight:bold; color:#ffd700; }
    .nav-links a { color:white; margin-left:20px; text-decoration:none; }
    .nav-links a:hover { color:#ffd700; }
    main { padding:30px; background:rgba(0,0,0,0.6); min-height:80vh; }
    h1 { text-align:center; color:#ffd700; margin-bottom:20px; }
    form { max-width:400px; margin:0 auto; display:flex; flex-direction:column; gap:15px; }
    input { padding:10px; border:none; border-radius:5px; }
    button { padding:10px; background:#ffd700; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:orange; }
  </style>
</head>
<body>
  <header>
    <img src="ic.png" alt="Logo" class="logo">
    <div class="title">Hostelio</div>
    <div class="nav-links">
      <a href="user_dashboard.html">Home</a>
      <a href="index.html">Logout</a>
    </div>
  </header>

  <main>
    <h1>Account Settings</h1>
    <form id="settingsForm">
      <input type="email" id="newEmail" placeholder="New Email">
      <input type="password" id="newPassword" placeholder="New Password">
      <button type="submit">Update</button>
    </form>
    <p id="status"></p>
  </main>

  <footer>&copy; 2025 Hostelio. All rights reserved.</footer>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { updateEmail, updatePassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const form=document.getElementById("settingsForm");
    const status=document.getElementById("status");

    onAuthStateChanged(auth,(user)=>{
      if(!user){ status.innerText="Login required."; }
    });

    form.addEventListener("submit",async(e)=>{
      e.preventDefault();
      const user=auth.currentUser;
      if(!user){ status.innerText="No user logged in"; return; }
      try{
        if(newEmail.value) await updateEmail(user,newEmail.value);
        if(newPassword.value) await updatePassword(user,newPassword.value);
        status.innerText="Updated successfully!";
      }catch(err){
        status.innerText="Error: "+err.message;
      }
    });
  </script>
</body>
</html>
